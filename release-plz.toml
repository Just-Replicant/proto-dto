# https://release-plz.dev/docs/config
[workspace]
# Keep CHANGELOG.md up to date in the release PR (git-cliff, Keep a Changelog).
changelog_update = true
git_tag_enable = true
git_release_enable = true
publish = true
# Fail the release PR job if the crate no longer packages cleanly.
publish_allow_dirty = false
semver_check = true
# Only open a release PR when there are commits that change the package.
release_always = false

[[package]]
name = "proto-dto"
changelog_path = "CHANGELOG.md"
# Keep the `v0.1.0` tags proto-dto had as a single-package repository.
git_tag_name = "v{{ version }}"

[[package]]
name = "proto-dto-build"
changelog_path = "proto-dto-build/CHANGELOG.md"
git_tag_name = "proto-dto-build-v{{ version }}"

# Test-only proc macro, never released.
[[package]]
name = "frb-attr-shim"
release = false
