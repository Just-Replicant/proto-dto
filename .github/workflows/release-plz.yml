name: Release-plz

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  # Publish unpublished versions to crates.io, push the git tag and create the
  # GitHub release. Uses crates.io trusted publishing: release-plz exchanges
  # the GitHub OIDC token for a short-lived crates.io token itself, so there is
  # no CARGO_REGISTRY_TOKEN secret and no crates-io-auth-action step.
  release-plz-release:
    name: Release-plz release
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'Just-Replicant' }}
    permissions:
      # Push tags and create releases.
      contents: write
      # Detect the release PR and its commits.
      pull-requests: read
      # Mint the OIDC token for crates.io trusted publishing.
      id-token: write
    # No `concurrency` here: a pending release must never be cancelled.
    steps:
      - &checkout
        name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: release-plz releases from the release PR's last commit.
          fetch-depth: 0
          persist-credentials: false
      - &install-rust
        name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - name: Run release-plz
        uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Open or update the PR that bumps the version and the changelog.
  release-plz-pr:
    name: Release-plz PR
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'Just-Replicant' }}
    permissions:
      # Push to the release PR branch.
      contents: write
      # Create and update the release PR.
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - *checkout
      - *install-rust
      - name: Run release-plz
        uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
